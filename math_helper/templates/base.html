{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Math Helper{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body class="d-flex flex-column min-vh-100 color-scheme-light bg-1 {% block body_class %}{% endblock %}">
    {% block site_header %}{% include "includes/header.html" %}{% endblock %}
    <main class="container-fluid flex-grow-1 {% block main_class %}px-3 py-4 md:px-4 md:py-5{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% block site_footer %}{% include "includes/footer.html" %}{% endblock %}
  </body>
</html>
